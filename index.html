<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030511">
  <title>Para ti · Una galaxia de flores amarillas</title>
  <style>
    :root {
      --ink: #030511;
      --cream: #fff9dc;
      --gold: #ffd746;
      --warm-gold: #f6a71d;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { color: var(--cream); font-family: Georgia, "Times New Roman", serif; touch-action: manipulation; }

    #scene {
      isolation: isolate;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #151648 0%, #090d28 31%, #040613 67%, #02030a 100%);
    }

    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

    .atmosphere, .vignette, .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .atmosphere {
      z-index: 2;
      background:
        radial-gradient(circle at 50% 48%, transparent 0 24%, rgba(255, 207, 57, .055) 39%, transparent 64%),
        radial-gradient(ellipse at 50% 50%, transparent 41%, rgba(1, 2, 8, .15) 71%, rgba(0, 0, 0, .68) 118%);
      mix-blend-mode: screen;
    }
    .vignette { z-index: 6; box-shadow: inset 0 0 18vmax 3vmax rgba(0, 0, 0, .66); }
    .grain {
      z-index: 7;
      opacity: .075;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.62'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .copy {
      position: absolute;
      z-index: 10;
      top: 50%; left: 50%;
      width: min(88vw, 850px);
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      text-wrap: balance;
      opacity: 0;
      will-change: opacity, transform, filter;
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: #fff0a5;
      font: 600 clamp(.66rem, 1.5vw, .9rem)/1.35 system-ui, sans-serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1, h2 { margin: 0; font-weight: 600; }
    h1 {
      font-size: clamp(3.8rem, 11vw, 9.5rem);
      line-height: .8;
      color: #fffdf4;
      text-shadow: 0 0 16px rgba(255, 243, 182, .5), 0 0 42px rgba(255, 191, 42, .24);
    }
    h2 {
      font-size: clamp(2.5rem, 7.4vw, 6.6rem);
      line-height: .94;
      letter-spacing: -.035em;
      color: #fffdf4;
      text-shadow: 0 0 13px rgba(255, 244, 202, .58), 0 0 30px rgba(244, 186, 43, .3);
    }
    .line {
      max-width: 37rem;
      margin: 1.25rem auto 0;
      color: rgba(255, 250, 226, .96);
      font-size: clamp(1rem, 2.1vw, 1.35rem);
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .85);
    }
    .closing {
      margin-top: 1.2rem;
      color: #ffe997;
      font: 500 clamp(.76rem, 1.5vw, .94rem)/1.4 system-ui, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    #intro.play { animation: rise-and-dissolve 4.8s cubic-bezier(.16,.8,.2,1) forwards; }
    #final.show { animation: final-arrival 2.8s cubic-bezier(.16,.86,.18,1) forwards; }
    @keyframes rise-and-dissolve {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(.86); filter: blur(14px); }
      20%, 60% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(1.08); filter: blur(9px); }
    }
    @keyframes final-arrival {
      0% { opacity: 0; transform: translate(-50%, -44%) scale(.9); filter: blur(14px); }
      48% { opacity: 1; transform: translate(-50%, -50%) scale(1.018); filter: blur(0); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
    }

    #replay {
      position: absolute; z-index: 20; right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom));
      width: 2.85rem; height: 2.85rem; border: 1px solid rgba(255, 230, 119, .42); border-radius: 50%;
      color: #fff0a3; background: rgba(4, 6, 20, .44); backdrop-filter: blur(10px);
      cursor: pointer; font: 1.2rem/1 system-ui; opacity: 0; transform: translateY(.5rem); transition: opacity .6s ease, transform .6s ease, background .2s ease;
    }
    #replay.visible { opacity: 1; transform: none; }
    #replay:hover { background: rgba(255, 212, 60, .14); }
    .hint {
      position: absolute; z-index: 20; bottom: max(1.45rem, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      color: rgba(255, 243, 181, .72); font: 500 .67rem/1.3 system-ui, sans-serif; letter-spacing: .22em;
      text-align: center; text-transform: uppercase; opacity: 0; transition: opacity .8s ease; pointer-events: none;
    }
    .hint.visible { opacity: 1; }
    @media (max-width: 560px) { .copy { width: 92vw; } .eyebrow { letter-spacing: .24em; } .hint { width: 80vw; font-size: .58rem; } }
    @media (prefers-reduced-motion: reduce) { .grain { display: none; } #intro.play, #final.show { animation-duration: .01ms; animation-delay: 0s; } }
  </style>
</head>
<body>
  <main id="scene" aria-label="Un viaje hacia una galaxia de flores amarillas">
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="atmosphere"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <section id="intro" class="copy" aria-live="polite">
      <p class="eyebrow">Un pequeño viaje para ti</p>
      <h1>✦</h1>
      <p class="line">Hasta encontrar un jardín<br>entre las estrellas.</p>
    </section>

    <section id="final" class="copy" aria-live="polite">
      <p class="eyebrow">Para ti, bella amiga</p>
      <h2>Risueña,<br>encantadora</h2>
      <p class="closing">Dios te bendiga mucho</p>
    </section>

    <p class="hint" id="hint">Toca la pantalla para viajar otra vez</p>
    <button id="replay" type="button" aria-label="Repetir el viaje">↻</button>
  </main>

  <script>
    (() => {
      'use strict';
      const canvas = document.querySelector('#space');
      const ctx = canvas.getContext('2d', { alpha: false });
      const scene = document.querySelector('#scene');
      const intro = document.querySelector('#intro');
      const final = document.querySelector('#final');
      const hint = document.querySelector('#hint');
      const replay = document.querySelector('#replay');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TAU = Math.PI * 2;
      let w = 0, h = 0, dpr = 1, radius = 0, stars = [], pollen = [], start = 0, frameId = 0, finished = false;

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const smooth = t => t * t * (3 - 2 * t);
      const easeOut = t => 1 - Math.pow(1 - t, 4);
      const rand = (min, max) => min + Math.random() * (max - min);

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight; radius = Math.hypot(w, h) * .62;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildField();
      }

      function buildField() {
        const amount = Math.round(clamp(w * h / 2150, 260, 650));
        stars = Array.from({ length: amount }, () => ({
          angle: rand(0, TAU), distance: Math.pow(Math.random(), .58) * radius + 3,
          depth: rand(.12, 1), size: rand(.32, 1.7), hue: Math.random() > .82 ? rand(190, 226) : rand(42, 58),
          phase: rand(0, TAU)
        }));
        pollen = Array.from({ length: Math.round(amount * .36) }, () => ({
          angle: rand(0, TAU), distance: Math.pow(Math.random(), .7) * radius,
          depth: rand(.2, 1), size: rand(.6, 2.2), phase: rand(0, TAU)
        }));
      }

      function flower(x, y, size, spin, alpha = 1, soft = false) {
        if (size < .65 || alpha <= 0) return;
        ctx.save(); ctx.translate(x, y); ctx.rotate(spin); ctx.globalAlpha = alpha;
        if (soft) { ctx.shadowColor = 'rgba(255, 195, 30, .68)'; ctx.shadowBlur = size * 1.1; }
        const petals = 10;
        for (let i = 0; i < petals; i++) {
          ctx.rotate(TAU / petals);
          const petal = ctx.createLinearGradient(0, -size * .2, 0, -size * 1.02);
          petal.addColorStop(0, '#f0a71a'); petal.addColorStop(.44, '#ffd84b'); petal.addColorStop(1, '#fff6b5');
          ctx.fillStyle = petal;
          ctx.beginPath(); ctx.ellipse(0, -size * .62, size * .24, size * .67, 0, 0, TAU); ctx.fill();
        }
        const centre = ctx.createRadialGradient(-size * .12, -size * .15, size * .05, 0, 0, size * .42);
        centre.addColorStop(0, '#ffe47a'); centre.addColorStop(.36, '#bc7412'); centre.addColorStop(1, '#4d2705');
        ctx.fillStyle = centre; ctx.beginPath(); ctx.arc(0, 0, size * .39, 0, TAU); ctx.fill();
        ctx.restore();
      }

      function coreFlower(cx, cy, grow, now) {
        const s = Math.min(w, h) * (.07 + grow * .18);
        const breath = 1 + Math.sin(now * .00115) * .018;
        ctx.save(); ctx.translate(cx, cy); ctx.scale(breath, breath);
        const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.65);
        halo.addColorStop(0, 'rgba(255, 238, 124, .34)'); halo.addColorStop(.24, 'rgba(255, 193, 31, .13)'); halo.addColorStop(1, 'rgba(255, 178, 10, 0)');
        ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, s * 2.65, 0, TAU); ctx.fill();
        for (let r = 0; r < 2; r++) {
          ctx.save(); ctx.rotate(now * (r ? -.00007 : .00005) + r * .18);
          ctx.globalAlpha = r ? .64 : .9;
          const count = r ? 16 : 12;
          for (let i = 0; i < count; i++) {
            ctx.rotate(TAU / count);
            const petal = ctx.createLinearGradient(0, -s * .12, 0, -s * (r ? 1.35 : 1.02));
            petal.addColorStop(0, r ? '#d9870c' : '#efaa12'); petal.addColorStop(.5, '#ffda43'); petal.addColorStop(1, '#fff5aa');
            ctx.fillStyle = petal;
            ctx.beginPath(); ctx.ellipse(0, -s * (r ? .86 : .64), s * (r ? .18 : .245), s * (r ? .69 : .72), 0, 0, TAU); ctx.fill();
          }
          ctx.restore();
        }
        const centre = ctx.createRadialGradient(-s * .14, -s * .15, 0, 0, 0, s * .48);
        centre.addColorStop(0, '#ffe480'); centre.addColorStop(.38, '#ba7010'); centre.addColorStop(1, '#482207');
        ctx.fillStyle = centre; ctx.beginPath(); ctx.arc(0, 0, s * .46, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255, 223, 103, .78)';
        for (let i = 0; i < 28; i++) { const a = i * 2.4; const r = Math.sqrt(i / 29) * s * .33; ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, Math.max(1, s * .025), 0, TAU); ctx.fill(); }
        ctx.restore();
      }

      function paint(now) {
        const elapsed = now - start;
        const duration = reduceMotion ? 900 : 15500;
        const p = clamp(elapsed / duration, 0, 1);
        const cx = w / 2, cy = h / 2;
        ctx.fillStyle = '#030511'; ctx.fillRect(0, 0, w, h);
        const nebula = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        nebula.addColorStop(0, 'rgba(76, 55, 157, .2)'); nebula.addColorStop(.4, 'rgba(16, 26, 88, .15)'); nebula.addColorStop(1, 'rgba(1, 3, 11, 0)');
        ctx.fillStyle = nebula; ctx.fillRect(0, 0, w, h);

        const launch = smooth(clamp((p - .16) / .49, 0, 1));
        const settle = smooth(clamp((p - .57) / .2, 0, 1));
        const warp = (1 - settle) * launch;
        for (const star of stars) {
          const shimmer = .64 + Math.sin(now * .0016 + star.phase) * .24;
          const drift = Math.sin(now * .00013 + star.phase) * .018;
          const angle = star.angle + drift;
          const initial = star.distance * (.16 + launch * 4.7);
          const distant = star.distance * (.68 + Math.sin(now * .00013 + star.phase) * .018);
          const distance = initial * (1 - settle) + distant * settle;
          const x = cx + Math.cos(angle) * distance;
          const y = cy + Math.sin(angle) * distance * .72;
          const alpha = clamp((.13 + star.depth * .68) * shimmer * (1 - launch * .08), 0, .9);
          if (warp > .01) {
            const length = (3 + 48 * Math.pow(warp, 1.5)) * star.depth;
            ctx.save(); ctx.translate(x, y); ctx.rotate(angle + Math.PI / 2); ctx.globalAlpha = alpha * (.45 + warp * .75);
            const trail = ctx.createLinearGradient(0, -length, 0, 4);
            trail.addColorStop(0, 'rgba(174, 198, 255, 0)'); trail.addColorStop(.55, `hsla(${star.hue}, 100%, 84%, .45)`); trail.addColorStop(1, 'rgba(255, 233, 127, 1)');
            ctx.fillStyle = trail; ctx.fillRect(-Math.max(.35, star.size * .25), -length, Math.max(.7, star.size * .5), length + 4); ctx.restore();
          } else {
            ctx.save(); ctx.globalAlpha = alpha;
            ctx.fillStyle = star.hue > 100 ? '#d9e4ff' : '#fff4bd'; ctx.beginPath(); ctx.arc(x, y, star.size * (.45 + star.depth * .45), 0, TAU); ctx.fill(); ctx.restore();
          }
        }

        const flowersIn = smooth(clamp((p - .41) / .36, 0, 1));
        if (flowersIn) {
          for (const mote of pollen) {
            const a = mote.angle + now * (.000025 + mote.depth * .000045) + Math.sin(now * .00022 + mote.phase) * .07;
            const r = mote.distance * (.12 + flowersIn * .72) * mote.depth;
            const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .65;
            flower(x, y, mote.size * (.4 + flowersIn) * mote.depth, now * .0002 + mote.phase, (.16 + mote.depth * .47) * flowersIn);
          }
        }

        const bloom = smooth(clamp((p - .67) / .23, 0, 1));
        if (bloom) coreFlower(cx, cy, bloom, now);
        if (p > .84 && !finished) {
          finished = true; final.classList.add('show'); hint.classList.add('visible'); replay.classList.add('visible');
        }
        if (p < 1 || !reduceMotion) frameId = requestAnimationFrame(paint);
      }

      function play() {
        cancelAnimationFrame(frameId); finished = false; start = performance.now();
        intro.classList.remove('play'); final.classList.remove('show'); hint.classList.remove('visible'); replay.classList.remove('visible');
        void intro.offsetWidth; intro.classList.add('play'); frameId = requestAnimationFrame(paint);
      }
      addEventListener('resize', resize, { passive: true });
      replay.addEventListener('click', event => { event.stopPropagation(); play(); });
      scene.addEventListener('click', event => { if (finished && event.target !== replay) play(); });
      resize(); play();
    })();
  </script>
</body>
</html>
